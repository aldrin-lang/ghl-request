<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GHL Request</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: #f1f3f4; font-family: "Google Sans", Roboto, Arial, sans-serif; color: #1f1f1f; }
  .card { max-width: 520px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  h1 { font-size: 22px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: #5f6368; font-size: 14px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; color: #444; margin: 16px 0 6px; }
  input, select, textarea { width: 100%; font: inherit; font-size: 15px; padding: 10px 12px; border: 1px solid #c4c7c5; border-radius: 8px; background: #fff; }
  input:focus, select:focus, textarea:focus { outline: 2px solid #0b57d0; border-color: transparent; }
  textarea { min-height: 110px; resize: vertical; }
  button { margin-top: 24px; width: 100%; padding: 12px; border: 0; border-radius: 100px; background: #0b57d0; color: #fff; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; }
  button:disabled { background: #a8c7fa; cursor: default; }
  .err { color: #b3261e; font-size: 14px; margin-top: 12px; }
  .done { text-align: center; padding: 24px 0; }
  .done h2 { font-weight: 500; margin: 0 0 8px; }
  .muted { color: #5f6368; font-size: 14px; }
  .opt { color: #5f6368; }
</style>
</head>
<body>
<div class="card" id="formCard">
  <h1>New GHL request</h1>
  <p class="sub">The GHL team will pick this up and reply in the Chat space.</p>
  <form id="f">
    <label for="name">Your name</label>
    <input id="name" required maxlength="100">
    <label for="type">What do you need?</label>
    <select id="type">
      <option>Need Access</option><option>New client / sub-account</option><option>Build something</option>
      <option>Fix something</option><option>Report</option><option>Question / other</option>
    </select>
    <label for="company">Company / sub-account</label>
    <input id="company" required maxlength="200" placeholder="e.g. OutsourceForce.ai, Cartow">
    <label for="details">Details</label>
    <textarea id="details" required maxlength="3000" placeholder="What should happen? Include names, numbers, steps"></textarea>
    <label for="links">Links <span class="opt">(optional)</span></label>
    <input id="links" maxlength="1000" placeholder="Screenshots, docs, GHL links">
    <button id="btn" type="submit">Send request</button>
    <div class="err" id="err"></div>
  </form>
</div>
<div class="card done" id="doneCard" style="display:none">
  <h2>Request sent</h2>
  <p id="doneText" class="muted"></p>
  <p class="muted">You can close this window.</p>
</div>
<script>
  const ENDPOINT = 'https://script.google.com/macros/s/AKfycbwJo_mNa37mhmu06hOCngXspYaPOUHkUFZ7nx--BG6hbwbeogvgJaxCBIOivz8RXxjrQg/exec';
  const $ = id => document.getElementById(id);
  $('f').addEventListener('submit', e => {
    e.preventDefault();
    $('btn').disabled = true; $('btn').textContent = 'Sending...'; $('err').textContent = '';
    const data = { name: $('name').value, type: $('type').value, company: $('company').value,
      details: $('details').value, links: $('links').value };
    // No Google login is sent, so it works whatever accounts the person is signed into.
    fetch(ENDPOINT, { method: 'POST', body: JSON.stringify(data), credentials: 'omit' })
      .then(r => r.json())
      .then(res => {
        if (!res.ok) throw new Error(res.error);
        $('formCard').style.display = 'none'; $('doneCard').style.display = 'block';
        $('doneText').textContent = res.id + ' is now in the GHL Requests space.';
      })
      .catch(err => {
        $('btn').disabled = false; $('btn').textContent = 'Send request';
        $('err').textContent = (err && err.message) || 'Something went wrong. Please try again.';
      });
  });
</script>
</body>
</html>
